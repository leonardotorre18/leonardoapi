services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: leonardoapi
    depends_on:
      - mongodb
      - blobstorage
    env_file:
      - .env
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    networks:
      - network
    ports:
      - "3000:3000"
  
  mongodb:
    image: mongo
    container_name: mongodb
    networks:
      - network
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGODB_USERNAME}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGODB_PASSWORD}"
    ports:
      - "${MONGO_PORT:-27017}:27017"
  
  blobstorage:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: azureblobstorage
    networks:
      - network
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    command: ["azurite-blob", "--blobHost", "0.0.0.0"]
    restart: unless-stopped

networks: 
  network:
    driver: bridge